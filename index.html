<style>
:root{
 --bg:#070d1d;--card:#101a31;--card2:#0b1428;
 --line:#24314d;--text:#f6f8ff;--muted:#8492b2;
 --purple:#6979ff;--green:#20dfa6;--red:#ff647c;

}
*{box-sizing:border-box}
body{
 margin:0;background:
 radial-gradient(circle at 50% -10%,#17234a 0,transparent 32%),

<body>

<main class="app">
 <div class="top">

 <div class="kicker">BET AI 4.0</div>

  Реальные события, статистический анализ и журнал прогнозов.

 <div class="stats">

 <div class="modalIn">
  <button class="back" onclick="closeModal()">← Назад</button>

<script>
let sport="basketball";
let view="all";
let matches=[];
let rawResponse=null;

const content=document.getElementById("content");

function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 }[c]));
}

function first(...v){
 return v.find(x=>x!==undefined&&x!==null&&x!=="");
}

function objName(o){
 if(!o)return "";
 if(typeof o==="string")return o.trim();
 if(typeof o!=="object")return "";
 return first(
  o.name,o.fullName,o.full_name,o.shortName,o.short_name,
  o.displayName,o.display_name,o.title,o.teamName,
  o.team_name,o.label,o.slug
 )||"";
}

function objLogo(o){
 if(!o||typeof o!=="object")return "";
 return first(
  o.logo,o.logoUrl,o.logo_url,o.image,o.imageUrl,
  o.image_url,o.badge,o.crest,o.icon
 )||"";
}

function recursiveTeam(m,side){
 const keys=side==="home"
  ?["home","hometeam","home_team","team1","participant1","competitor1"]
  :["away","awayteam","away_team","team2","participant2","competitor2"];

 for(const k of Object.keys(m||{})){
  const n=k.toLowerCase().replace(/[-_\s]/g,"");
  if(keys.some(x=>n===x.replace(/[-_\s]/g,""))){
   const name=objName(m[k]);
   if(name)return{name,logo:objLogo(m[k]),raw:m[k]};
  }
 }

 const arrays=[m.participants,m.competitors,m.teams,m.opponents].filter(Array.isArray);

 for(const arr of arrays){
  for(let i=0;i<arr.length;i++){
   const item=arr[i];
   const type=String(first(
    item?.type,item?.side,item?.position,
    item?.homeAway,item?.home_away
   )||"").toLowerCase();

   if(
    (side==="home"&&/home|^1$/.test(type))||
    (side==="away"&&/away|^2$/.test(type))
   ){
    const o=item.team||item;
    const name=objName(o);
    if(name)return{name,logo:objLogo(o),raw:o};
   }
  }

  if(arr.length>=2){
   const o=arr[side==="home"?0:1]?.team||arr[side==="home"?0:1];
   const name=objName(o);
   if(name)return{name,logo:objLogo(o),raw:o};
  }
 }

 return{name:"",logo:"",raw:null};
}

function parse(raw){
 let arr;

 if(Array.isArray(raw))arr=raw;
 else arr=first(
  raw?.matches,raw?.events,raw?.results,
  raw?.data?.matches,raw?.data?.events,
  raw?.data?.results,raw?.data
 );

 if(!Array.isArray(arr))arr=[];

 return arr.map((m,i)=>{
  const h=recursiveTeam(m,"home");
  const a=recursiveTeam(m,"away");

  const home=first(
   h.name,m.home_name,m.homeName,m.home_team_name,
   m.homeTeamName,m.localteam_name,m.player1_name
  )||"Команда 1";

  const away=first(
   a.name,m.away_name,m.awayName,m.away_team_name,
   m.awayTeamName,m.visitorteam_name,m.player2_name
  )||"Команда 2";

  const scores=m.score||m.scores||{};

  const hs=first(
   m.home_score,m.homeScore,m.score_home,m.scoreHome,
   m.localteam_score,scores.home,scores.homeScore,scores.home_score
  );

  const as=first(
   m.away_score,m.awayScore,m.score_away,m.scoreAway,
   m.visitorteam_score,scores.away,scores.awayScore,scores.away_score
  );

  const comp=first(m.competition,m.league,m.tournament);

  const league=first(
   objName(comp),m.league_name,m.leagueName,
   m.competition_name,m.competitionName,"Матч"
  );

  const status=String(first(
   m.status,m.state,m.match_status,m.matchStatus,
   m.status_name,"scheduled"
  )).toLowerCase();

  const time=first(
   m.start_time,m.startTime,m.start_at,m.datetime,
   m.date_time,m.date,m.time
  );

  return{
   i,
   id:first(m.id,m.match_id,m.event_id,m.slug,i),
   slug:first(m.slug,m.match_slug,m.matchSlug),
   raw:m,home,away,
   homeLogo:h.logo,awayLogo:a.logo,
   hs,as,league,status,time
  };
 });
}

function isLive(s){
 return /live|progress|quarter|period|half|1st|2nd|3rd|4th/.test(s);
}
function isDone(s){
 return /finished|final|ended|completed|full.?time|ft/.test(s);
}
function isUpcoming(s){return !isLive(s)&&!isDone(s)}

function dt(v){
 if(!v)return "Время уточняется";
 const d=new Date(v);
 if(Number.isNaN(d.getTime()))return String(v);
 return d.toLocaleString("ru-RU",{
  day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"
 });
}

function score(v){return v===0||v?esc(v):"—"}

function logo(url){
 return url
 ?`<img class="teamLogo" src="${esc(url)}" onerror="this.outerHTML='<span class=&quot;ball&quot;></span>'">`
 :`<span class="ball"></span>`;
}

/* ---------- REAL DATA DISCOVERY ---------- */

function arraysDeep(o,depth=0,out=[]){
 if(!o||typeof o!=="object"||depth>4)return out;

 for(const [k,v] of Object.entries(o)){
  if(Array.isArray(v)&&v.length){
   out.push({key:k.toLowerCase(),data:v});
  }else if(v&&typeof v==="object"){
   arraysDeep(v,depth+1,out);
  }
 }
 return out;
}

function extractForm(m,side){
 const raw=m.raw;
 const arrays=arraysDeep(raw);

 const wanted=arrays.filter(x=>
  /form|recent|last|history|matches/.test(x.key)&&
  (x.key.includes(side)||!/(home|away)/.test(x.key))
 );

 for(const x of wanted){
  const result=[];

  for(const game of x.data.slice(0,10)){
   if(typeof game==="string"){
    const r=game.toUpperCase();
    if(["W","L","D"].includes(r))result.push(r);
    continue;
   }

   const r=String(first(game?.result,game?.outcome,game?.status,"")).toUpperCase();

   if(/^W|WIN/.test(r))result.push("W");
   else if(/^L|LOSS/.test(r))result.push("L");
   else if(/^D|DRAW/.test(r))result.push("D");
  }

  if(result.length)return result.slice(0,5);
 }

 return [];
}

function numericDeep(o,patterns,depth=0){
 if(!o||typeof o!=="object"||depth>4)return null;

 for(const [k,v] of Object.entries(o)){
  const key=k.toLowerCase();

  if(patterns.some(p=>key.includes(p))&&
     (typeof v==="number"||(!isNaN(Number(v))&&v!==""))){
   return Number(v);
  }
 }

 for(const v of Object.values(o)){
  if(v&&typeof v==="object"){
   const r=numericDeep(v,patterns,depth+1);
   if(r!==null)return r;
  }
 }
 return null;
}

/* ---------- ANALYSIS ENGINE ---------- */

function formScore(form){
 if(!form.length)return null;
 let n=0;
 form.forEach(x=>{
  if(x==="W")n+=3;
  if(x==="D")n+=1;
 });
 return Math.round(n/(form.length*3)*100);
}

function analyze(m){
 const hf=extractForm(m,"home");
 const af=extractForm(m,"away");

 const hForm=formScore(hf);
 const aForm=formScore(af);

 const hWins=numericDeep(m.raw,["home_win","homewins"]);
 const aWins=numericDeep(m.raw,["away_win","awaywins"]);

 let factors=[];
 let home=50;
 let evidence=0;

 if(hForm!==null&&aForm!==null){
  const diff=hForm-aForm;
  home+=diff*.18;
  factors.push({
   name:"Форма",
   home:hForm,
   away:aForm,
   text:diff>10?m.home+" выглядит лучше по доступной форме":
        diff<-10?m.away+" выглядит лучше по доступной форме":
        "Форма команд близка"
  });
  evidence+=35;
 }

 if(hWins!==null&&aWins!==null){
  const total=Math.max(1,hWins+aWins);
  const h=Math.round(hWins/total*100);
  home+=(h-50)*.15;
  factors.push({
   name:"Доступная статистика побед",
   home:h,
   away:100-h,
   text:"Расчёт использует найденные в данных показатели побед"
  });
  evidence+=20;
 }

 if(m.home!=="Команда 1"&&m.away!=="Команда 2")evidence+=15;
 if(m.league!=="Матч")evidence+=10;
 if(m.time)evidence+=5;

 /*
 Small home-context adjustment only when this is a team sport.
 It is deliberately low-weight and clearly disclosed.
 */
 if(["football","basketball","cricket"].includes(sport)){
  home+=2;
  factors.push({
   name:"Домашний контекст",
   home:52,
   away:48,
   text:"Небольшой базовый фактор хозяев; вес ограничен"
  });
  evidence+=5;
 }

 home=Math.max(20,Math.min(80,Math.round(home)));
 const away=100-home;

 let pick=null;
 let confidence="Недостаточно данных";

 if(evidence>=45){
  if(home>=57)pick=m.home;
  else if(home<=43)pick=m.away;
  else pick="Преимущество не выявлено";

  confidence=
   evidence>=75?"Высокое качество данных":
   evidence>=55?"Среднее качество данных":
   "Ограниченное качество данных";
 }

 return{
  hf,af,factors,
  home,away,evidence:Math.min(100,evidence),
  pick,confidence
 };
}

function formHTML(f){
 if(!f.length)
  return `<div class="small" style="margin-top:8px">В текущем ответе API форма не найдена.</div>`;

 return `<div class="form">${
  f.map(x=>`<span class="${x.toLowerCase()}">${x}</span>`).join("")
 }</div>`;
}

/* ---------- JOURNAL ---------- */

function getJournal(){
 try{return JSON.parse(localStorage.getItem("betai4_journal")||"[]")}
 catch(e){return[]}
}

function setJournal(j){
 localStorage.setItem("betai4_journal",JSON.stringify(j.slice(0,500)));
 updateHeader();
}

function journalStats(){
 const j=getJournal();
 const settled=j.filter(x=>["win","loss","push"].includes(x.result));
 const wins=settled.filter(x=>x.result==="win").length;
 const losses=settled.filter(x=>x.result==="loss").length;
 const pushes=settled.filter(x=>x.result==="push").length;

 return{
  total:j.length,wins,losses,pushes,
  rate:(wins+losses)?Math.round(wins/(wins+losses)*100):null
 };
}

function savePrediction(i){
 const m=matches[i];
 const a=analyze(m);

 if(!a.pick||a.pick==="Преимущество не выявлено"){
  alert("Недостаточно данных для фиксации направления BET AI.");
  return;
 }

 const j=getJournal();

 if(j.some(x=>String(x.matchId)===String(m.id))){
  alert("Этот матч уже сохранён.");
  return;
 }

 j.unshift({
  id:Date.now(),
  matchId:m.id,
  sport,
  home:m.home,
  away:m.away,
  pick:a.pick,
  score:a.home,
  evidence:a.evidence,
  created:new Date().toISOString(),
  result:null
 });

 setJournal(j);
 alert("Прогноз зафиксирован в журнале.");
}

function settleJournal(){
 const j=getJournal();
 let changed=false;

 for(const p of j){
  if(p.result)continue;

  const m=matches.find(x=>String(x.id)===String(p.matchId));
  if(!m||!isDone(m.status))continue;

  const hs=Number(m.hs),as=Number(m.as);
  if(!Number.isFinite(hs)||!Number.isFinite(as))continue;

  if(hs===as){
   p.result="push";
  }else{
   const winner=hs>as?m.home:m.away;
   p.result=winner===p.pick?"win":"loss";
  }
  changed=true;
 }

 if(changed)setJournal(j);
}

function updateHeader(){
 const s=journalStats();
 document.getElementById("winrate").textContent=
  s.rate===null?"—":s.rate+"%";
}

/* ---------- MATCHES ---------- */

async function load(){
 content.innerHTML=`<div class="loading">Получаю реальные события…</div>`;

 try{
  const url="https://sportscore.com/api/widget/matches/?sport="+
   encodeURIComponent(sport)+"&limit=30";

  const r=await fetch(url,{cache:"no-store"});
  if(!r.ok)throw new Error("HTTP "+r.status);

  rawResponse=await r.json();
  matches=parse(rawResponse);

  settleJournal();
  render();

  document.getElementById("updated").textContent=
   new Date().toLocaleTimeString("ru-RU",{
    hour:"2-digit",minute:"2-digit"
   });

 }catch(e){
  console.error(e);
  content.innerHTML=`<div class="empty">Не удалось получить данные. Обнови страницу через несколько секунд.</div>`;
 }
}

function render(){
 updateHeader();

 document.getElementById("total").textContent=matches.length;
 document.getElementById("live").textContent=matches.filter(x=>isLive(x.status)).length;

 if(view==="journal"){
  renderJournal();
  return;
 }

 let list=matches;

 if(view==="live")list=list.filter(x=>isLive(x.status));
 if(view==="finished")list=list.filter(x=>isDone(x.status));
 if(view==="upcoming")list=list.filter(x=>isUpcoming(x.status));

 document.getElementById("sectionTitle").textContent=
  view==="live"?"LIVE":
  view==="finished"?"Завершённые":
  view==="upcoming"?"Предстоящие":"Матчи";

 if(!list.length){
  content.innerHTML=`<div class="empty">В этой категории событий сейчас нет.</div>`;
  return;
 }

 content.innerHTML=list.map(m=>{
  const i=matches.indexOf(m);
  const live=isLive(m.status);
  const done=isDone(m.status);
  const st=live?"LIVE":done?"ЗАВЕРШЁН":"СКОРО";

  return `
  <article class="match">
   <div class="matchTop">
    <div class="league">${esc(m.league)}</div>
    <div class="status ${live?"live":""}">${st}</div>
   </div>

   <div class="teamRow">
    <div class="team">${logo(m.homeLogo)}<span>${esc(m.home)}</span></div>
    <div class="score">${score(m.hs)}</div>
   </div>

   <div class="teamRow">
    <div class="team">${logo(m.awayLogo)}<span>${esc(m.away)}</span></div>
    <div class="score">${score(m.as)}</div>
   </div>

   <div class="divider"></div>

   <div class="meta">
    <span>${esc(dt(m.time))}</span>
    <span>${esc(sport)}</span>
   </div>

   <div class="actions">
    <button class="analyze" onclick="openMatch(${i})">✦ Глубокий анализ</button>
    <button class="save" onclick="savePrediction(${i})">☆</button>
   </div>
  </article>`;
 }).join("");
}

/* ---------- DETAIL ---------- */

function openMatch(i){
 const m=matches[i];
 const a=analyze(m);

 let factors=a.factors.map(f=>`
  <div class="factor">
   <div class="factorTop">
    <span>${esc(f.name)}</span>
    <b>${f.home} / ${f.away}</b>
   </div>
   <div class="bar"><div class="fill" style="width:${f.home}%"></div></div>
   <div class="small" style="margin-top:5px">${esc(f.text)}</div>
  </div>
 `).join("");

 if(!factors){
  factors=`<div class="notice">API этого события пока не содержит достаточно расширенной статистики для сравнения факторов. BET AI не будет придумывать отсутствующие показатели.</div>`;
 }

 const verdict=a.pick
 ?a.pick==="Преимущество не выявлено"
  ?`Статистического преимущества одной стороны пока не выявлено.`
  :`По доступным данным преимущество: <b>${esc(a.pick)}</b>.`
 :`Недостаточно данных для направления прогноза.`;

 document.getElementById("detail").innerHTML=`
  <div class="hero">
   <div class="heroLeague">${esc(m.league)}</div>
   <div class="vs">
    <div class="club">${esc(m.home)}</div>
    <div class="bigScore">${score(m.hs)} : ${score(m.as)}</div>
    <div class="club">${esc(m.away)}</div>
   </div>
   <div class="meta" style="margin-top:17px">
    <span>${esc(dt(m.time))}</span>
    <span>${isLive(m.status)?"LIVE":isDone(m.status)?"FT":"UPCOMING"}</span>
   </div>
  </div>

  <div class="block ai">
   <div class="aiLabel">BET AI • STATISTICAL ENGINE</div>
   <h2 style="margin-bottom:5px">Анализ матча</h2>

   <div class="aiScore">
    <div>
     <div class="quality">КАЧЕСТВО ИСХОДНЫХ ДАННЫХ</div>
     <strong>${a.evidence}%</strong>
    </div>
    <div style="text-align:right">
     <div class="quality">${esc(m.home)}</div>
     <b>${a.home}%</b>
     <div class="quality">${esc(m.away)} · ${a.away}%</div>
    </div>
   </div>

   <div class="notice">
    <b>Важно:</b> проценты выше — индекс статистического сравнения, а не вероятность исхода матча.
   </div>

   ${factors}

   <div class="pred">
    <div class="predTitle">${verdict}</div>
    <div class="confidence">${esc(a.confidence)}</div>
   </div>
  </div>

  <div class="block">
   <h3>Форма команд</h3>
   <div class="small">${esc(m.home)}</div>
   ${formHTML(a.hf)}
   <div class="small" style="margin-top:15px">${esc(m.away)}</div>
   ${formHTML(a.af)}
  </div>

  <div class="block">
   <h3>Что проверяет BET AI</h3>
   <div class="grid">
    <div class="metric"><small>ФОРМА</small><strong>${a.hf.length&&a.af.length?"Есть":"Нет данных"}</strong></div>
    <div class="metric"><small>H2H</small><strong>${hasData(m.raw,/h2h|head.?to.?head/)?"Есть":"Нет данных"}</strong></div>
    <div class="metric"><small>СЧЁТ</small><strong>${m.hs!==undefined&&m.hs!==""?"Есть":"Ожидается"}</strong></div>
    <div class="metric"><small>ТУРНИР</small><strong>${m.league!=="Матч"?"Есть":"Нет данных"}</strong></div>
   </div>

   <div class="notice">
    Движок использует только найденные фактические данные. Отсутствующие H2H, составы, травмы или статистика не подменяются выдуманными значениями.
   </div>
  </div>

  <div class="block">
   <h3>Анализ в ChatGPT</h3>
   <div class="small">
    Кнопка создаст пакет фактов этого матча. Скопируй его и отправь мне в ChatGPT — я смогу провести уже качественный рассудочный анализ без OpenAI API.
   </div>
   <button class="copy" onclick="copyForGPT(${i})">📋 Скопировать пакет для ChatGPT</button>
   <button class="primary" style="width:100%;margin-top:8px" onclick="savePrediction(${i})">☆ Зафиксировать прогноз</button>
  </div>
 `;

 document.getElementById("modal").classList.add("show");
 document.body.style.overflow="hidden";
}

function hasData(o,re,depth=0){
 if(!o||typeof o!=="object"||depth>4)return false;
 for(const [k,v] of Object.entries(o)){
  if(re.test(k)&&v)return true;
  if(v&&typeof v==="object"&&hasData(v,re,depth+1))return true;
 }
 return false;
}

function closeModal(){
 document.getElementById("modal").classList.remove("show");
 document.body.style.overflow="";
}

/* ---------- CHATGPT PACKAGE ---------- */

async function copyForGPT(i){
 const m=matches[i];
 const a=analyze(m);

 const packageText=
`Проведи глубокий анализ спортивного матча.

Спорт: ${sport}
Турнир: ${m.league}
Матч: ${m.home} — ${m.away}
Дата/время: ${dt(m.time)}
Статус: ${m.status}
Текущий/итоговый счёт: ${m.hs ?? "нет"} : ${m.as ?? "нет"}

Доступная форма ${m.home}: ${a.hf.length?a.hf.join(" "):"нет данных"}
Доступная форма ${m.away}: ${a.af.length?a.af.join(" "):"нет данных"}

BET AI statistical index:
${m.home}: ${a.home}
${m.away}: ${a.away}
Качество доступных данных: ${a.evidence}/100

Найденные факторы:
${a.factors.length?a.factors.map(x=>"- "+x.name+": "+x.text).join("\n"):"Расширенные факторы в API не найдены."}

Сделай независимый анализ. Не принимай BET AI index за вероятность победы. Проверь актуальную форму, последние матчи, H2H, домашние/выездные показатели, атаку/защиту, составы и травмы, мотивацию, расписание и другие существенные факторы, если они доступны. Отдельно укажи аргументы против основного сценария и уровень неопределённости. Не выдумывай отсутствующие данные.`;

 try{
  await navigator.clipboard.writeText(packageText);
  alert("Пакет скопирован. Вставь его в чат со мной.");
 }catch(e){
  prompt("Скопируй этот текст:",packageText);
 }
}

/* ---------- JOURNAL UI ---------- */

function renderJournal(){
 document.getElementById("sectionTitle").textContent="Мои прогнозы";

 const j=getJournal();
 const s=journalStats();

 let top=`
 <div class="block" style="margin-top:0">
  <h3 style="margin-top:0">Статистика журнала</h3>
  <div class="grid">
   <div class="metric"><small>ВСЕГО</small><strong>${s.total}</strong></div>
   <div class="metric"><small>WIN RATE</small><strong>${s.rate===null?"—":s.rate+"%"}</strong></div>
   <div class="metric"><small>WIN / LOSS</small><strong>${s.wins} / ${s.losses}</strong></div>
   <div class="metric"><small>PUSH</small><strong>${s.pushes}</strong></div>
  </div>
  <div class="notice">
   История хранится локально на этом iPhone/браузере. Очистка данных Safari может удалить журнал.
  </div>
 </div>`;

 if(!j.length){
  content.innerHTML=top+`<div class="empty">Ты ещё не зафиксировал ни одного прогноза.</div>`;
  return;
 }

 content.innerHTML=top+j.map(p=>`
  <div class="journalItem">
   <div class="row">
    <b>${esc(p.home)} — ${esc(p.away)}</b>
    <span class="result ${p.result||""}">${p.result?p.result.toUpperCase():"OPEN"}</span>
   </div>
   <div class="small" style="margin-top:8px">Выбор: <b>${esc(p.pick)}</b></div>
   <div class="small">Данные: ${p.evidence}% · ${esc(p.sport)}</div>
   <div class="small">${new Date(p.created).toLocaleString("ru-RU")}</div>
  </div>
 `).join("");
}

/* ---------- CONTROLS ---------- */

document.querySelectorAll(".sport").forEach(b=>{
 b.onclick=()=>{
  document.querySelectorAll(".sport").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  sport=b.dataset.sport;
  view="all";
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.view==="all"));
  load();
 };
});

document.querySelectorAll(".tab").forEach(b=>{
 b.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  view=b.dataset.view;
  render();
 };
});

updateHeader();
load();
setInterval(load,60000);
</script>
