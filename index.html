<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<title>BET AI 3.0</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:radial-gradient(circle at 50% -10%,#172347 0,transparent 34%),#080b12;
color:white;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
button{font:inherit}
.app{max-width:620px;margin:auto;padding:24px 16px 70px}
.top,.row,.matchHead,.teamRow{
display:flex;align-items:center;justify-content:space-between;gap:12px
}
.logo{font-size:29px;font-weight:900}
.logo b{color:#7180ff}
.badge{
font-size:10px;font-weight:900;padding:7px 10px;
border-radius:30px;background:#14352c;color:#55dfa9
}
.eyebrow{
font-size:11px;letter-spacing:1.5px;color:#7786a7;
font-weight:900;margin-top:26px
}
h1{font-size:31px;line-height:1.08;margin:8px 0}
.muted{color:#8996b1}
.stats{
display:grid;grid-template-columns:repeat(3,1fr);
gap:9px;margin:22px 0
}
.stat{
background:#12192a;border:1px solid #202a40;
border-radius:17px;padding:14px
}
.stat small{display:block;color:#7886a5;font-size:10px}
.stat strong{display:block;font-size:23px;margin-top:7px}
.filters{
display:flex;gap:8px;overflow:auto;padding-bottom:14px;
scrollbar-width:none
}
.filters::-webkit-scrollbar{display:none}
.filter{
white-space:nowrap;border:1px solid #273149;background:#111827;
color:#aab5ce;border-radius:99px;padding:9px 13px;font-weight:800
}
.filter.active{background:#7180ff;color:white;border-color:#7180ff}
.section{font-size:22px;font-weight:900;margin:15px 0}
.match{
background:#12192a;border:1px solid #202a40;border-radius:21px;
padding:17px;margin:12px 0;cursor:pointer
}
.league{
font-size:10px;color:#7585a6;font-weight:900;text-transform:uppercase
}
.status{
font-size:10px;font-weight:900;background:#0b1220;
color:#a4afc7;padding:6px 9px;border-radius:30px
}
.status.live{background:#14352c;color:#55dfa9}
.teamRow{margin-top:15px}
.team{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:850}
.team img{width:31px;height:31px;object-fit:contain}
.dot{width:11px;height:11px;background:#7180ff;border-radius:50%}
.score{font-size:21px;font-weight:950}
.divider{height:1px;background:#202a40;margin:14px 0}
.meta{display:flex;justify-content:space-between;color:#8491ac;font-size:12px}
.openHint{color:#7180ff;font-size:11px;font-weight:800;margin-top:13px}
.loading{
height:160px;border-radius:21px;margin:12px 0;
background:linear-gradient(90deg,#111827,#182238,#111827);
background-size:200%;animation:p 1.2s infinite
}
@keyframes p{to{background-position:-200%}}
.error,.empty{
background:#111827;border-radius:18px;padding:24px;
text-align:center;color:#8d9ab5
}
.refresh,.primary{
width:100%;border:0;border-radius:15px;padding:14px;
background:#7180ff;color:white;font-weight:900;margin-top:14px
}

/* MODAL */

.modal{
display:none;position:fixed;inset:0;background:#080b12;
z-index:100;overflow:auto
}
.modal.show{display:block}
.modalInner{max-width:620px;margin:auto;padding:20px 16px 70px}
.back{
border:0;background:#141c2d;color:white;border-radius:13px;
padding:10px 13px;font-weight:800
}
.hero{
margin-top:17px;padding:20px;background:#12192a;
border:1px solid #202a40;border-radius:23px
}
.heroLeague{color:#7887a7;font-size:11px;font-weight:900}
.vs{
display:grid;grid-template-columns:1fr auto 1fr;
align-items:center;gap:10px;margin-top:20px
}
.club{text-align:center;font-weight:900}
.club img{display:block;width:48px;height:48px;object-fit:contain;margin:0 auto 8px}
.bigScore{font-size:27px;font-weight:950}
.analysis{
margin-top:14px;background:linear-gradient(145deg,#151e34,#111827);
border:1px solid #293556;border-radius:22px;padding:18px
}
.aiTitle{font-size:12px;color:#8e9cff;font-weight:900;letter-spacing:1px}
.aiHeadline{font-size:21px;font-weight:900;margin:8px 0}
.notice{
color:#8e9ab3;font-size:12px;line-height:1.5;
background:#0c1220;padding:13px;border-radius:13px
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.metric{
background:#0c1220;border-radius:15px;padding:13px
}
.metric small{color:#75829e;font-size:10px}
.metric strong{display:block;font-size:19px;margin-top:5px}
.factor{margin-top:14px}
.factorTop{display:flex;justify-content:space-between;font-size:12px}
.bar{height:7px;background:#080d17;border-radius:10px;overflow:hidden;margin-top:7px}
.fill{height:100%;background:#7180ff;border-radius:10px}
.history{
background:#12192a;border:1px solid #202a40;
border-radius:18px;padding:15px;margin-top:10px
}
.historyTitle{font-weight:900}
.form{display:flex;gap:6px;margin-top:10px}
.form span{
width:29px;height:29px;display:grid;place-items:center;
border-radius:9px;background:#202a40;font-size:11px;font-weight:900
}
.form .w{background:#174334;color:#62e6b1}
.form .l{background:#45202a;color:#ff8298}
.form .d{background:#383b45;color:#ddd}
.predStats{
display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px
}
.predStat{background:#0c1220;padding:12px;border-radius:14px}
.predStat small{font-size:9px;color:#75829e}
.predStat strong{display:block;margin-top:5px;font-size:18px}
.source{text-align:center;color:#65728e;font-size:10px;margin-top:20px;line-height:1.5}
</style>
</head>

<body>

<main class="app">

<div class="top">
<div class="logo">BET <b>AI</b></div>
<div class="badge">● REAL DATA</div>
</div>

<div class="eyebrow">BET AI 3.0</div>
<h1>Спортивная аналитика нового уровня</h1>
<div class="muted">
Реальные матчи, форма команд и подготовка глубокого AI-анализа.
</div>

<section class="stats">
<div class="stat"><small>Матчей</small><strong id="total">—</strong></div>
<div class="stat"><small>LIVE</small><strong id="liveCount">—</strong></div>
<div class="stat"><small>Завершено</small><strong id="doneCount">—</strong></div>
</section>

<div class="filters">
<button class="filter active" data-sport="basketball">🏀 Баскетбол</button>
<button class="filter" data-sport="football">⚽ Футбол</button>
<button class="filter" data-sport="tennis">🎾 Теннис</button>
<button class="filter" data-sport="cricket">🏏 Крикет</button>
</div>

<div class="row">
<div class="section">Матчи</div>
<div id="updated" class="muted" style="font-size:11px"></div>
</div>

<div id="matches"></div>

<button class="refresh" onclick="loadMatches()">Обновить матчи</button>

<div class="source">
BET AI использует спортивные данные как источник фактов.
Прогноз не является гарантией результата.
</div>

</main>


<!-- MATCH ANALYSIS -->

<div class="modal" id="modal">

<div class="modalInner">

<button class="back" onclick="closeMatch()">← Все матчи</button>

<div id="matchDetail"></div>

</div>

</div>


<script>

let currentSport="basketball";
let currentMatches=[];

const matchesBox=document.getElementById("matches");

function esc(v){
return String(v??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",
'"':"&quot;","'":"&#39;"
}[c]))
}

function first(...v){
return v.find(x=>x!==undefined&&x!==null&&x!=="")
}

function teamValue(t){

if(typeof t==="string") return t;

if(!t) return "";

return first(
t.name,
t.title,
t.shortName,
t.short_name,
t.team_name,
t.displayName
)||"";

}

function logoValue(t){

if(!t || typeof t==="string") return "";

return first(
t.logo,
t.image,
t.badge,
t.crest,
t.logo_url
)||"";

}

function parseMatches(raw){

let arr=
Array.isArray(raw)
? raw
: first(
raw.matches,
raw.events,
raw.data,
raw.results
);

if(arr && !Array.isArray(arr)){
arr=first(arr.matches,arr.events,arr.data,[]);
}

if(!Array.isArray(arr)) arr=[];

return arr.map((m,index)=>{

let homeObj=first(
m.homeTeam,
m.home_team,
m.team1
);

let awayObj=first(
m.awayTeam,
m.away_team,
m.team2
);

/*
SportScore may also return home/away directly
as strings. This fixes the old Home/Away bug.
*/

let home=first(
teamValue(homeObj),
teamValue(m.home),
m.home_name,
m.homeTeamName,
m.team_home,
m.home_team_name
);

let away=first(
teamValue(awayObj),
teamValue(m.away),
m.away_name,
m.awayTeamName,
m.team_away,
m.away_team_name
);

if(!home && typeof m.home==="string") home=m.home;
if(!away && typeof m.away==="string") away=m.away;

let scoreObj=m.score||{};

let hs=first(
m.home_score,
m.homeScore,
m.scoreHome,
scoreObj.home,
scoreObj.homeScore
);

let as=first(
m.away_score,
m.awayScore,
m.scoreAway,
scoreObj.away,
scoreObj.awayScore
);

let league=first(
m.league?.name,
m.league?.title,
m.tournament?.name,
m.competition?.name,
m.league_name,
m.leagueName,
m.competition,
"Матч"
);

let status=String(first(
m.status,
m.state,
m.match_status,
m.matchStatus,
"scheduled"
)).toLowerCase();

let time=first(
m.start_time,
m.startTime,
m.datetime,
m.date,
m.time,
m.start_at
);

return{
raw:m,
index,
id:first(m.id,m.match_id,m.event_id,index),
home:home||"Команда 1",
away:away||"Команда 2",
homeLogo:first(logoValue(homeObj),logoValue(m.home)),
awayLogo:first(logoValue(awayObj),logoValue(m.away)),
hs,as,league,status,time
};

});

}

function isLive(s){
return /live|progress|quarter|period|half|1st|2nd|3rd|4th/.test(s)
}

function isDone(s){
return /finished|final|ended|completed|full.?time|ft/.test(s)
}

function timeText(v){

if(!v) return "Время уточняется";

let d=new Date(v);

if(isNaN(d)) return String(v);

return d.toLocaleString("ru-RU",{
day:"2-digit",
month:"2-digit",
hour:"2-digit",
minute:"2-digit"
});

}

function score(v){
return v===0||v ? esc(v) : "—"
}

function teamLogo(url){

return url
? `<img src="${esc(url)}" alt="">`
: `<span class="dot"></span>`;

}

function renderMatches(){

document.getElementById("total").textContent=currentMatches.length;

document.getElementById("liveCount").textContent=
currentMatches.filter(x=>isLive(x.status)).length;

document.getElementById("doneCount").textContent=
currentMatches.filter(x=>isDone(x.status)).length;

if(!currentMatches.length){

matchesBox.innerHTML=
`<div class="empty">
Событий сейчас не найдено.
</div>`;

return;

}

matchesBox.innerHTML=currentMatches.map((m,i)=>{

let live=isLive(m.status);
let done=isDone(m.status);

let st=
live?"LIVE":
done?"ЗАВЕРШЁН":
m.status==="scheduled"?"СКОРО":
m.status.toUpperCase();

return`

<article class="match" onclick="openMatch(${i})">

<div class="matchHead">

<div class="league">${esc(m.league)}</div>

<div class="status ${live?"live":""}">
${esc(st)}
</div>

</div>

<div class="teamRow">

<div class="team">
${teamLogo(m.homeLogo)}
${esc(m.home)}
</div>

<div class="score">${score(m.hs)}</div>

</div>

<div class="teamRow">

<div class="team">
${teamLogo(m.awayLogo)}
${esc(m.away)}
</div>

<div class="score">${score(m.as)}</div>

</div>

<div class="divider"></div>

<div class="meta">

<span>${esc(timeText(m.time))}</span>

<span>${esc(currentSport)}</span>

</div>

<div class="openHint">
Открыть глубокий анализ →
</div>

</article>

`;

}).join("");

}


async function loadMatches(){

matchesBox.innerHTML=
`<div class="loading"></div>
<div class="loading"></div>`;

try{

let url=
"https://sportscore.com/api/widget/matches/?sport="+
encodeURIComponent(currentSport)+
"&limit=30";

let response=await fetch(url,{cache:"no-store"});

if(!response.ok)
throw new Error("HTTP "+response.status);

let json=await response.json();

currentMatches=parseMatches(json);

renderMatches();

document.getElementById("updated").textContent=
"обновлено "+
new Date().toLocaleTimeString("ru-RU",{
hour:"2-digit",
minute:"2-digit"
});

}catch(err){

console.error(err);

matchesBox.innerHTML=
`<div class="error">
Не удалось получить спортивные данные.
Попробуй обновить страницу через несколько секунд.
</div>`;

}

}


/* ---------- MATCH ANALYSIS ---------- */

function formFromRaw(raw,key){

let possible=first(
raw[key],
raw[key+"_form"],
raw[key+"Form"]
);

if(Array.isArray(possible)){

return possible.slice(0,5).map(x=>{

let s=String(
first(x.result,x.status,x,"")
).toUpperCase();

if(s.startsWith("W")) return "W";
if(s.startsWith("L")) return "L";

return "D";

});

}

return [];

}

function formHTML(form){

if(!form.length)
return `<div class="muted" style="font-size:12px;margin-top:8px">
Форма будет доступна после подключения расширенной истории команды.
</div>`;

return`
<div class="form">
${form.map(x=>
`<span class="${x.toLowerCase()}">${x}</span>`
).join("")}
</div>
`;

}

function predictionStats(){

let history=[];

try{
history=JSON.parse(
localStorage.getItem("betai_predictions")||"[]"
);
}catch(e){}

let settled=history.filter(x=>x.result);

let wins=settled.filter(x=>x.result==="win").length;

let losses=settled.filter(x=>x.result==="loss").length;

let rate=
settled.length
? Math.round(wins/settled.length*100)
: 0;

return{total:history.length,wins,losses,rate};

}

function saveAnalysis(m){

let history=[];

try{
history=JSON.parse(
localStorage.getItem("betai_predictions")||"[]"
);
}catch(e){}

if(history.some(x=>String(x.id)===String(m.id)))
return;

history.unshift({
id:m.id,
sport:currentSport,
home:m.home,
away:m.away,
created:new Date().toISOString(),
result:null
});

localStorage.setItem(
"betai_predictions",
JSON.stringify(history.slice(0,200))
);

openMatch(m.index);

}

function openMatch(i){

let m=currentMatches[i];

if(!m) return;

let homeForm=formFromRaw(m.raw,"home");
let awayForm=formFromRaw(m.raw,"away");

let ps=predictionStats();

/*
These factor bars are intentionally NOT presented
as a GPT prediction.

They indicate which data categories are currently
available for future GPT analysis.
*/

let formAvailable=
homeForm.length||awayForm.length ? 100 : 15;

let scoreAvailable=
(m.hs!==""&&m.hs!=null) ? 100 : 20;

let leagueAvailable=
m.league && m.league!=="Матч" ? 100 : 30;

document.getElementById("matchDetail").innerHTML=`

<div class="hero">

<div class="heroLeague">
${esc(m.league)}
</div>

<div class="vs">

<div class="club">
${m.homeLogo
? `<img src="${esc(m.homeLogo)}">`
: ""}
${esc(m.home)}
</div>

<div class="bigScore">
${score(m.hs)} : ${score(m.as)}
</div>

<div class="club">
${m.awayLogo
? `<img src="${esc(m.awayLogo)}">`
: ""}
${esc(m.away)}
</div>

</div>

<div class="meta" style="margin-top:18px">

<span>${esc(timeText(m.time))}</span>

<span>
${isLive(m.status)?"LIVE":
isDone(m.status)?"Завершён":"Предстоящий"}
</span>

</div>

</div>


<div class="analysis">

<div class="aiTitle">
BET AI • DEEP ANALYSIS
</div>

<div class="aiHeadline">
Глубокий анализ матча
</div>

<div class="notice">
Сейчас BET AI собирает фактические данные матча.
Финальный прогноз GPT будет подключён через защищённый
сервер. Я не показываю выдуманный процент уверенности,
если модель ещё не получила необходимые данные.
</div>


<div class="factor">

<div class="factorTop">
<span>Форма команд</span>
<b>${formAvailable===100?"доступна":"частично"}</b>
</div>

<div class="bar">
<div class="fill" style="width:${formAvailable}%"></div>
</div>

</div>


<div class="factor">

<div class="factorTop">
<span>Текущий / итоговый счёт</span>
<b>${scoreAvailable===100?"доступен":"ожидается"}</b>
</div>

<div class="bar">
<div class="fill" style="width:${scoreAvailable}%"></div>
</div>

</div>


<div class="factor">

<div class="factorTop">
<span>Контекст турнира</span>
<b>${leagueAvailable===100?"доступен":"частично"}</b>
</div>

<div class="bar">
<div class="fill" style="width:${leagueAvailable}%"></div>
</div>

</div>

</div>


<div class="section">
Форма
</div>

<div class="history">

<div class="historyTitle">
${esc(m.home)}
</div>

${formHTML(homeForm)}

</div>


<div class="history">

<div class="historyTitle">
${esc(m.away)}
</div>

${formHTML(awayForm)}

</div>


<div class="section">
Что будет учитывать GPT
</div>

<div class="history">

<div style="line-height:1.8;color:#a7b2ca;font-size:13px">

✓ последние 5–10 матчей<br>
✓ домашнюю и выездную форму<br>
✓ средние набранные и пропущенные очки/голы<br>
✓ очные встречи H2H<br>
✓ силу атаки и защиты<br>
✓ положение в турнире<br>
✓ темп игры и доступную расширенную статистику<br>
✓ состав и кадровые данные, когда источник их предоставляет<br>
✓ рыночную линию отдельно от собственного анализа модели<br>
✓ противоречащие прогнозу факторы и уровень неопределённости

</div>

</div>


<div class="section">
Статистика BET AI
</div>

<div class="history">

<div class="predStats">

<div class="predStat">
<small>СОХРАНЕНО</small>
<strong>${ps.total}</strong>
</div>

<div class="predStat">
<small>ПОБЕД</small>
<strong>${ps.wins}</strong>
</div>

<div class="predStat">
<small>WIN RATE</small>
<strong>${ps.rate}%</strong>
</div>

</div>

<div class="muted"
style="font-size:11px;margin-top:12px;line-height:1.5">

Win rate считается только по реально завершённым
и проверенным прогнозам. Непроверенные прогнозы
не считаются победами.

</div>

</div>


<button class="primary"
onclick='saveAnalysis(currentMatches[${i}])'>
Сохранить матч для анализа
</button>

<div class="source">
Следующий этап — подключение GPT backend и автоматическая
проверка результатов прогнозов.
</div>

`;

document.getElementById("modal").classList.add("show");

document.body.style.overflow="hidden";

}

function closeMatch(){

document.getElementById("modal").classList.remove("show");

document.body.style.overflow="";

}


/* ---------- FILTERS ---------- */

document.querySelectorAll(".filter").forEach(btn=>{

btn.onclick=()=>{

document.querySelectorAll(".filter").forEach(x=>
x.classList.remove("active")
);

btn.classList.add("active");

currentSport=btn.dataset.sport;

loadMatches();

};

});


loadMatches();

setInterval(loadMatches,60000);

</script>

</body>
</html>
