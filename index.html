<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#091126">
<title>BET AI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#091126;
 color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.app{max-width:650px;margin:auto;padding:30px 20px 70px}
.top{display:flex;align-items:center;justify-content:space-between}
.logo{font-size:30px;font-weight:950}
.logo span{color:#7180ff}
.liveBadge{
 background:#063e35;color:#19e3a6;padding:10px 15px;
 border-radius:30px;font-size:12px;font-weight:900
}
.kicker{
 margin-top:50px;color:#7484aa;font-size:12px;
 letter-spacing:3px;font-weight:900
}
h1{font-size:38px;line-height:1.1;margin:14px 0}
.sub{color:#8795b4;font-size:18px;line-height:1.5}
.stats{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:10px;margin:28px 0
}
.stat{
 border:1px solid #26324c;border-radius:22px;
 padding:18px;background:#101a31
}
.stat small{color:#7c89a7}
.stat strong{display:block;font-size:28px;margin-top:10px}

.filters{display:flex;gap:10px;overflow:auto;margin:20px 0}
.filters::-webkit-scrollbar{display:none}
.filter{
 flex:none;border:1px solid #2a3651;background:#0d172c;
 color:#9ba7c2;border-radius:30px;padding:12px 17px;
 font-weight:800
}
.filter.active{background:#6878ff;color:#fff;border-color:#6878ff}

.head{display:flex;justify-content:space-between;align-items:center}
.head h2{font-size:26px}
.updated{font-size:12px;color:#7886a6}

.match{
 background:#101a31;border:1px solid #26324c;
 border-radius:25px;padding:20px;margin:15px 0
}
.matchTop{
 display:flex;justify-content:space-between;
 align-items:flex-start;gap:10px
}
.league{
 color:#8493b5;font-size:11px;font-weight:900;
 text-transform:uppercase;max-width:70%
}
.status{
 background:#0a1326;padding:7px 10px;
 border-radius:20px;font-size:10px;font-weight:900
}
.status.live{color:#19e3a6;background:#063e35}
.team{
 display:flex;align-items:center;justify-content:space-between;
 gap:12px;margin-top:18px
}
.teamName{
 display:flex;align-items:center;gap:12px;
 font-size:18px;font-weight:900;min-width:0
}
.teamName span:last-child{
 overflow:hidden;text-overflow:ellipsis
}
.logoImg{width:34px;height:34px;object-fit:contain}
.ball{
 width:13px;height:13px;border-radius:50%;
 background:#6e7dff;flex:none
}
.score{font-size:26px;font-weight:950}
.line{height:1px;background:#26324c;margin:18px 0}
.meta{display:flex;justify-content:space-between;color:#7886a6;font-size:12px}
.analyze{
 margin-top:17px;width:100%;border:0;
 background:#6878ff;color:white;padding:13px;
 border-radius:14px;font-weight:900
}
.loading,.error{
 padding:30px;text-align:center;background:#101a31;
 border-radius:20px;color:#8996b4
}
.refresh{
 width:100%;padding:15px;border:1px solid #2c3956;
 background:#111c34;color:#fff;border-radius:16px;
 font-weight:900;margin-top:10px
}
.powered{
 text-align:center;color:#687795;font-size:11px;
 margin-top:28px
}
.powered a{color:#8c99ff;text-decoration:none}

/* ANALYSIS */

.modal{
 display:none;position:fixed;inset:0;background:#091126;
 z-index:99;overflow:auto
}
.modal.show{display:block}
.modalIn{max-width:650px;margin:auto;padding:22px 20px 70px}
.back{
 border:0;background:#17213a;color:#fff;
 padding:11px 15px;border-radius:13px;font-weight:900
}
.analysisHero{
 margin-top:20px;background:#101a31;
 border:1px solid #26324c;border-radius:25px;padding:22px
}
.analysisLeague{color:#8493b5;font-size:11px;font-weight:900}
.versus{
 display:grid;grid-template-columns:1fr auto 1fr;
 gap:10px;align-items:center;margin-top:25px;text-align:center
}
.club{font-weight:900}
.bigScore{font-size:26px;font-weight:950}
.block{
 background:#101a31;border:1px solid #26324c;
 border-radius:22px;padding:19px;margin-top:15px
}
.block h3{margin:0 0 12px}
.ai{
 background:linear-gradient(145deg,#172344,#111a31);
 border-color:#35477d
}
.aiLabel{
 color:#91a0ff;font-size:11px;font-weight:900;
 letter-spacing:1.5px
}
.notice{
 background:#0a1326;border-radius:14px;padding:14px;
 color:#9aa6bf;font-size:13px;line-height:1.55;margin-top:13px
}
.dataGrid{
 display:grid;grid-template-columns:1fr 1fr;gap:9px
}
.data{
 background:#0a1326;border-radius:14px;padding:13px
}
.data small{color:#71809e;font-size:10px}
.data strong{display:block;margin-top:5px}
.aiButton{
 width:100%;border:0;border-radius:15px;padding:15px;
 background:#6878ff;color:#fff;font-weight:950;margin-top:15px
}
.aiButton:disabled{opacity:.55}
.predGrid{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:8px;margin-top:10px
}
.pred{
 background:#0a1326;border-radius:14px;padding:12px
}
.pred small{font-size:9px;color:#71809e}
.pred strong{display:block;font-size:20px;margin-top:5px}
</style>
</head>

<body>

<div class="app">

<div class="top">
 <div class="logo">BET <span>AI</span></div>
 <div class="liveBadge">● REAL DATA</div>
</div>

<div class="kicker">SPORTS DASHBOARD</div>
<h1>Матчи и статистика<br>в реальном времени</h1>

<div class="sub">
Счёт, команды, статус и расписание загружаются автоматически.
</div>

<div class="stats">
 <div class="stat"><small>Матчей</small><strong id="total">—</strong></div>
 <div class="stat"><small>LIVE</small><strong id="live">—</strong></div>
 <div class="stat"><small>Завершено</small><strong id="done">—</strong></div>
</div>

<div class="filters">
 <button class="filter active" data-sport="basketball">🏀 Баскетбол</button>
 <button class="filter" data-sport="football">⚽ Футбол</button>
 <button class="filter" data-sport="tennis">🎾 Теннис</button>
 <button class="filter" data-sport="cricket">🏏 Крикет</button>
</div>

<div class="head">
 <h2>Матчи</h2>
 <div class="updated" id="updated"></div>
</div>

<div id="matches"></div>

<button class="refresh" onclick="load()">Обновить данные</button>

<div class="powered">
Powered by
<a href="https://sportscore.com/" target="_blank" rel="noopener">SportScore</a>
</div>

</div>

<div class="modal" id="modal">
 <div class="modalIn">
  <button class="back" onclick="closeAnalysis()">← Назад</button>
  <div id="analysis"></div>
 </div>
</div>

<script>

let sport="basketball";
let matches=[];

const box=document.getElementById("matches");

/* ---------- HELPERS ---------- */

function esc(v){
 return String(v ?? "").replace(/[&<>"']/g,x=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 }[x]));
}

function value(...x){
 return x.find(v=>v!==undefined && v!==null && v!=="");
}

function objName(o){

 if(!o) return "";

 if(typeof o==="string") return o.trim();

 if(typeof o!=="object") return "";

 return value(
  o.name,
  o.fullName,
  o.full_name,
  o.shortName,
  o.short_name,
  o.displayName,
  o.display_name,
  o.title,
  o.teamName,
  o.team_name,
  o.label,
  o.slug
 ) || "";

}

function objLogo(o){

 if(!o || typeof o!=="object") return "";

 return value(
  o.logo,
  o.logoUrl,
  o.logo_url,
  o.image,
  o.imageUrl,
  o.image_url,
  o.badge,
  o.crest,
  o.icon
 ) || "";

}

/*
 Recursively searches nested structures.

 This is the important change:
 we no longer assume SportScore always puts
 teams in one specific field.
*/

function recursiveTeam(m,side){

 const words = side==="home"
 ? ["home","hometeam","home_team","team1","participant1","competitor1"]
 : ["away","awayteam","away_team","team2","participant2","competitor2"];

 for(const key of Object.keys(m||{})){

  const normalized=key.toLowerCase().replace(/[-\s]/g,"");

  if(words.some(w=>normalized===w.replace(/_/g,""))){

   const found=objName(m[key]);

   if(found) return {
    name:found,
    logo:objLogo(m[key]),
    raw:m[key]
   };

  }

 }

 /*
 participants / competitors array
*/

 const arrays=[
  m.participants,
  m.competitors,
  m.teams,
  m.opponents
 ].filter(Array.isArray);

 for(const arr of arrays){

  for(let i=0;i<arr.length;i++){

   const item=arr[i];

   const type=String(value(
    item?.type,
    item?.side,
    item?.position,
    item?.homeAway,
    item?.home_away
   )||"").toLowerCase();

   if(
    (side==="home" && /home|1/.test(type)) ||
    (side==="away" && /away|2/.test(type))
   ){
    const n=objName(item.team||item);

    if(n) return {
     name:n,
     logo:objLogo(item.team||item),
     raw:item
    };
   }

  }

  /*
   If no side metadata exists,
   use first and second participants.
  */

  if(arr.length>=2){

   const index=side==="home"?0:1;
   const item=arr[index];
   const n=objName(item?.team||item);

   if(n) return {
    name:n,
    logo:objLogo(item?.team||item),
    raw:item
   };

  }

 }

 return {name:"",logo:"",raw:null};
}

function parse(raw){

 let arr;

 if(Array.isArray(raw)){
  arr=raw;
 }else{
  arr=value(
   raw?.matches,
   raw?.events,
   raw?.results,
   raw?.data?.matches,
   raw?.data?.events,
   raw?.data?.results,
   raw?.data
  );
 }

 if(!Array.isArray(arr)) arr=[];

 return arr.map((m,i)=>{

  let h=recursiveTeam(m,"home");
  let a=recursiveTeam(m,"away");

  /*
   Direct explicit fallbacks
  */

  const home=value(
   h.name,
   m.home_name,
   m.homeName,
   m.home_team_name,
   m.homeTeamName,
   m.localteam_name,
   m.localTeamName,
   m.player1_name,
   m.player1Name
  );

  const away=value(
   a.name,
   m.away_name,
   m.awayName,
   m.away_team_name,
   m.awayTeamName,
   m.visitorteam_name,
   m.visitorTeamName,
   m.player2_name,
   m.player2Name
  );

  const scoreObj=m.score||m.scores||{};

  const hs=value(
   m.home_score,
   m.homeScore,
   m.score_home,
   m.scoreHome,
   m.localteam_score,
   scoreObj.home,
   scoreObj.homeScore,
   scoreObj.home_score
  );

  const as=value(
   m.away_score,
   m.awayScore,
   m.score_away,
   m.scoreAway,
   m.visitorteam_score,
   scoreObj.away,
   scoreObj.awayScore,
   scoreObj.away_score
  );

  const competition=value(
   m.competition,
   m.league,
   m.tournament
  );

  const league=value(
   objName(competition),
   m.league_name,
   m.leagueName,
   m.competition_name,
   m.competitionName,
   "Матч"
  );

  const status=String(value(
   m.status,
   m.state,
   m.match_status,
   m.matchStatus,
   m.status_name,
   "scheduled"
  )).toLowerCase();

  const time=value(
   m.start_time,
   m.startTime,
   m.start_at,
   m.datetime,
   m.date_time,
   m.date,
   m.time
  );

  const slug=value(
   m.slug,
   m.match_slug,
   m.matchSlug
  );

  return{
   raw:m,
   i,
   id:value(m.id,m.match_id,m.event_id,slug,i),
   slug,
   home:home || "Команда 1",
   away:away || "Команда 2",
   homeLogo:h.logo,
   awayLogo:a.logo,
   hs,
   as,
   league,
   status,
   time
  };

 });

}

function isLive(s){
 return /live|progress|quarter|period|half|1st|2nd|3rd|4th/.test(s);
}

function isDone(s){
 return /finished|final|ended|completed|full.?time|ft/.test(s);
}

function date(v){

 if(!v) return "Время уточняется";

 const d=new Date(v);

 if(Number.isNaN(d.getTime()))
  return String(v);

 return d.toLocaleString("ru-RU",{
  day:"2-digit",
  month:"2-digit",
  hour:"2-digit",
  minute:"2-digit"
 });

}

function score(v){
 return v===0 || v ? esc(v) : "—";
}

function logo(url){

 if(!url)
  return `<span class="ball"></span>`;

 return `<img class="logoImg"
 src="${esc(url)}"
 onerror="this.outerHTML='<span class=&quot;ball&quot;></span>'">`;

}

/* ---------- LOAD ---------- */

async function load(){

 box.innerHTML=`<div class="loading">Загружаю реальные матчи…</div>`;

 try{

  const url=
   "https://sportscore.com/api/widget/matches/"+
   "?sport="+encodeURIComponent(sport)+
   "&limit=30&src=zigredz.github.io";

  const r=await fetch(url,{cache:"no-store"});

  if(!r.ok)
   throw new Error("HTTP "+r.status);

  const raw=await r.json();

  matches=parse(raw);

  render();

 }catch(e){

  console.error(e);

  box.innerHTML=`
   <div class="error">
    Не удалось загрузить данные.<br><br>
    Попробуй нажать «Обновить данные».
   </div>
  `;

 }

}

/* ---------- RENDER ---------- */

function render(){

 document.getElementById("total").textContent=matches.length;

 document.getElementById("live").textContent=
  matches.filter(x=>isLive(x.status)).length;

 document.getElementById("done").textContent=
  matches.filter(x=>isDone(x.status)).length;

 document.getElementById("updated").textContent=
  "обновлено "+
  new Date().toLocaleTimeString("ru-RU",{
   hour:"2-digit",
   minute:"2-digit"
  });

 if(!matches.length){

  box.innerHTML=
   `<div class="error">Матчи не найдены.</div>`;

  return;
 }

 box.innerHTML=matches.map((m,i)=>{

  const live=isLive(m.status);
  const done=isDone(m.status);

  const status=
   live?"LIVE":
   done?"ЗАВЕРШЁН":
   "СКОРО";

  return`

  <div class="match">

   <div class="matchTop">

    <div class="league">
     ${esc(m.league)}
    </div>

    <div class="status ${live?"live":""}">
     ${status}
    </div>

   </div>

   <div class="team">

    <div class="teamName">
     ${logo(m.homeLogo)}
     <span>${esc(m.home)}</span>
    </div>

    <div class="score">${score(m.hs)}</div>

   </div>

   <div class="team">

    <div class="teamName">
     ${logo(m.awayLogo)}
     <span>${esc(m.away)}</span>
    </div>

    <div class="score">${score(m.as)}</div>

   </div>

   <div class="line"></div>

   <div class="meta">
    <span>${esc(date(m.time))}</span>
    <span>${esc(sport)}</span>
   </div>

   <button class="analyze"
    onclick="openAnalysis(${i})">
    ✦ Анализ BET AI
   </button>

  </div>

  `;

 }).join("");

}

/* ---------- ANALYSIS ---------- */

function predictionStats(){

 let h=[];

 try{
  h=JSON.parse(
   localStorage.getItem("betai_predictions")||"[]"
  );
 }catch(e){}

 const finished=h.filter(x=>x.result);

 const wins=finished.filter(
  x=>x.result==="win"
 ).length;

 return{
  total:h.length,
  wins,
  rate:finished.length
   ? Math.round(wins/finished.length*100)
   : 0
 };

}

function saveMatch(m){

 let h=[];

 try{
  h=JSON.parse(
   localStorage.getItem("betai_predictions")||"[]"
  );
 }catch(e){}

 if(!h.some(x=>String(x.id)===String(m.id))){

  h.unshift({
   id:m.id,
   slug:m.slug,
   sport,
   home:m.home,
   away:m.away,
   created:new Date().toISOString(),
   result:null
  });

  localStorage.setItem(
   "betai_predictions",
   JSON.stringify(h.slice(0,200))
  );

 }

 alert("Матч сохранён в журнал BET AI");

}

function openAnalysis(i){

 const m=matches[i];
 const ps=predictionStats();

 document.getElementById("analysis").innerHTML=`

 <div class="analysisHero">

  <div class="analysisLeague">
   ${esc(m.league)}
  </div>

  <div class="versus">

   <div class="club">
    ${esc(m.home)}
   </div>

   <div class="bigScore">
    ${score(m.hs)} : ${score(m.as)}
   </div>

   <div class="club">
    ${esc(m.away)}
   </div>

  </div>

 </div>

 <div class="block ai">

  <div class="aiLabel">
   BET AI • DEEP ANALYSIS
  </div>

  <h3 style="margin-top:10px">
   Глубокий анализ
  </h3>

  <div class="notice">
   Матч определён как
   <b>${esc(m.home)} — ${esc(m.away)}</b>.
   Здесь будет работать GPT-анализ после подключения
   защищённого AI-сервера.
  </div>

  <div class="dataGrid" style="margin-top:12px">

   <div class="data">
    <small>ТУРНИР</small>
    <strong>${esc(m.league)}</strong>
   </div>

   <div class="data">
    <small>СТАТУС</small>
    <strong>
     ${isLive(m.status)?"LIVE":
       isDone(m.status)?"FT":"UPCOMING"}
    </strong>
   </div>

  </div>

  <div class="notice">
   GPT будет анализировать форму последних матчей,
   домашние/выездные результаты, H2H, атаку и защиту,
   турнирное положение, доступную статистику матча,
   составы и коэффициенты. Коэффициенты будут одним
   из факторов, а не готовым ответом для модели.
  </div>

  <button class="aiButton" disabled>
   🧠 GPT backend — следующий этап
  </button>

 </div>

 <div class="block">

  <h3>История BET AI</h3>

  <div class="predGrid">

   <div class="pred">
    <small>СОХРАНЕНО</small>
    <strong>${ps.total}</strong>
   </div>

   <div class="pred">
    <small>ПОБЕД</small>
    <strong>${ps.wins}</strong>
   </div>

   <div class="pred">
    <small>WIN RATE</small>
    <strong>${ps.rate}%</strong>
   </div>

  </div>

  <button class="aiButton"
   onclick="saveMatch(matches[${i}])">
   Сохранить матч
  </button>

 </div>

 `;

 document.getElementById("modal").classList.add("show");
 document.body.style.overflow="hidden";

}

function closeAnalysis(){

 document.getElementById("modal").classList.remove("show");
 document.body.style.overflow="";

}

/* ---------- SPORT ---------- */

document.querySelectorAll(".filter").forEach(b=>{

 b.onclick=()=>{

  document.querySelectorAll(".filter")
   .forEach(x=>x.classList.remove("active"));

  b.classList.add("active");

  sport=b.dataset.sport;

  load();

 };

});

load();

setInterval(load,60000);

</script>

</body>
</html>
