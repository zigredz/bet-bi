<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<title>BET AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:
    radial-gradient(circle at 50% -10%,#172347 0,transparent 34%),
    #080b12;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.app{
  max-width:620px;
  margin:auto;
  padding:26px 16px 60px;
}

.top,.row,.matchHead,.scoreRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.logo{
  font-size:29px;
  font-weight:900;
}

.logo b{color:#7c8cff}

.live{
  font-size:11px;
  font-weight:800;
  color:#52e0a8;
  background:#16352d;
  padding:7px 10px;
  border-radius:99px;
}

.eyebrow{
  font-size:11px;
  letter-spacing:1.5px;
  color:#7886a5;
  font-weight:800;
  margin-top:28px;
}

h1{
  font-size:31px;
  line-height:1.1;
  margin:7px 0 9px;
}

.muted{color:#8e9ab4}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin:22px 0;
}

.stat{
  background:#12192a;
  border:1px solid #202a40;
  border-radius:17px;
  padding:14px;
}

.stat small{
  display:block;
  color:#7886a5;
  font-size:10px;
}

.stat strong{
  display:block;
  font-size:23px;
  margin-top:7px;
}

.filters{
  display:flex;
  gap:8px;
  overflow:auto;
  padding:2px 0 14px;
  scrollbar-width:none;
}

.filters::-webkit-scrollbar{display:none}

.filter{
  white-space:nowrap;
  border:1px solid #273149;
  background:#111827;
  color:#aab5ce;
  border-radius:99px;
  padding:9px 13px;
  font-weight:700;
}

.filter.active{
  background:#7180ff;
  color:#fff;
  border-color:#7180ff;
}

.section{
  font-size:21px;
  font-weight:850;
  margin:14px 0;
}

.match{
  background:#12192a;
  border:1px solid #202a40;
  border-radius:20px;
  padding:16px;
  margin:11px 0;
}

.league{
  font-size:10px;
  color:#7180a0;
  font-weight:800;
  text-transform:uppercase;
}

.status{
  font-size:10px;
  font-weight:850;
  color:#9ca9c4;
  background:#0c1220;
  padding:6px 8px;
  border-radius:99px;
}

.status.liveNow{
  color:#52e0a8;
  background:#15352d;
}

.team{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:800;
  font-size:16px;
}

.team img{
  width:30px;
  height:30px;
  object-fit:contain;
}

.dot{
  width:12px;
  height:12px;
  background:#7180ff;
  border-radius:50%;
}

.score{
  font-size:20px;
  font-weight:900;
}

.scoreRow{margin-top:14px}

.divider{
  height:1px;
  background:#202a40;
  margin:13px 0;
}

.meta{
  display:flex;
  justify-content:space-between;
  color:#8490aa;
  font-size:12px;
}

.empty,.error{
  padding:24px;
  text-align:center;
  background:#111827;
  border-radius:18px;
  color:#8f9bb4;
}

.refresh{
  width:100%;
  border:0;
  background:#7180ff;
  color:#fff;
  border-radius:15px;
  padding:14px;
  font-size:15px;
  font-weight:850;
  margin-top:14px;
}

.source{
  text-align:center;
  color:#64718e;
  font-size:10px;
  margin-top:18px;
  line-height:1.5;
}

.skeleton{
  height:155px;
  border-radius:20px;
  margin:11px 0;
  background:linear-gradient(90deg,#111827,#172035,#111827);
  background-size:200%;
  animation:p 1.3s infinite;
}

@keyframes p{
  to{background-position:-200%}
}

@media(max-width:390px){
  .stat{padding:12px 10px}
  .stat strong{font-size:20px}
}
</style>
</head>

<body>

<main class="app">

<div class="top">
  <div class="logo">BET <b>AI</b></div>
  <div class="live">● REAL DATA</div>
</div>

<div class="eyebrow">SPORTS DASHBOARD</div>

<h1>
  Матчи и статистика<br>
  в реальном времени
</h1>

<div class="muted">
  Счёт, статус и расписание загружаются автоматически.
</div>

<section class="stats">

  <div class="stat">
    <small>Матчей</small>
    <strong id="total">—</strong>
  </div>

  <div class="stat">
    <small>Сейчас LIVE</small>
    <strong id="live">—</strong>
  </div>

  <div class="stat">
    <small>Завершено</small>
    <strong id="finished">—</strong>
  </div>

</section>

<div class="filters">

  <button class="filter active" data-sport="basketball">
    🏀 Баскетбол
  </button>

  <button class="filter" data-sport="football">
    ⚽ Футбол
  </button>

  <button class="filter" data-sport="tennis">
    🎾 Теннис
  </button>

  <button class="filter" data-sport="cricket">
    🏏 Крикет
  </button>

</div>

<div class="row">

  <div class="section">
    Матчи
  </div>

  <div id="updated" class="muted"
       style="font-size:11px">
  </div>

</div>

<div id="matches">

  <div class="skeleton"></div>
  <div class="skeleton"></div>

</div>

<button class="refresh" id="refresh">
  Обновить данные
</button>

<div class="source">
  BET AI отображает спортивные данные и не гарантирует
  результат спортивных событий.
</div>

</main>

<script>

let sport = "basketball";

const box =
document.getElementById("matches");

function esc(s){

  return String(s ?? "")
  .replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));

}

function get(o,...keys){

  for(const k of keys){

    if(o && o[k] != null)
      return o[k];

  }

  return "";

}

function teamName(t,fallback){

  return get(
    t,
    "name",
    "shortName",
    "title"
  ) || fallback;

}

function teamLogo(t){

  return get(
    t,
    "logo",
    "image",
    "badge",
    "crest"
  );

}

function normalize(raw){

  const arr =
    Array.isArray(raw)
    ? raw
    : (
        raw.matches ||
        raw.events ||
        raw.data ||
        raw.results ||
        []
      );

  return arr.map(m=>{

    const home =
      get(
        m,
        "homeTeam",
        "home",
        "team1"
      ) || {};

    const away =
      get(
        m,
        "awayTeam",
        "away",
        "team2"
      ) || {};

    const status =
      String(
        get(
          m,
          "status",
          "state",
          "matchStatus"
        ) || ""
      ).toLowerCase();

    return {

      league:
        get(
          m.league || {},
          "name",
          "title"
        )
        ||
        get(
          m,
          "leagueName",
          "competition"
        )
        ||
        sport,

      home:
        teamName(
          home,
          get(
            m,
            "homeTeamName",
            "home_name"
          ) || "Home"
        ),

      away:
        teamName(
          away,
          get(
            m,
            "awayTeamName",
            "away_name"
          ) || "Away"
        ),

      homeLogo:teamLogo(home),
      awayLogo:teamLogo(away),

      hs:
        get(
          m,
          "homeScore",
          "scoreHome",
          "home_score"
        )
        ||
        get(
          m.score || {},
          "home",
          "homeScore"
        ),

      as:
        get(
          m,
          "awayScore",
          "scoreAway",
          "away_score"
        )
        ||
        get(
          m.score || {},
          "away",
          "awayScore"
        ),

      status:status,

      time:
        get(
          m,
          "time",
          "startTime",
          "date",
          "start_at"
        )

    };

  });

}

function isLive(s){

  return /live|in.?progress|1st|2nd|3rd|4th|half|quarter/
  .test(s);

}

function isDone(s){

  return /finished|final|ended|ft|completed/
  .test(s);

}

function render(items){

  document
  .getElementById("total")
  .textContent =
  items.length;

  document
  .getElementById("live")
  .textContent =
  items.filter(
    x=>isLive(x.status)
  ).length;

  document
  .getElementById("finished")
  .textContent =
  items.filter(
    x=>isDone(x.status)
  ).length;

  if(!items.length){

    box.innerHTML =
    '<div class="empty">' +
    'Сейчас матчей в этой категории не найдено.' +
    '</div>';

    return;

  }

  box.innerHTML =
  items.map(m=>{

    const live =
      isLive(m.status);

    const done =
      isDone(m.status);

    const st =
      live
      ? "LIVE"
      : done
      ? "ЗАВЕРШЁН"
      : (
          m.status
          ? m.status.toUpperCase()
          : "ЗАПЛАНИРОВАН"
        );

    const logo = u =>
      u
      ? '<img src="' +
        esc(u) +
        '" alt="">'
      : '<span class="dot"></span>';

    const score = v =>
      (v === 0 || v)
      ? esc(v)
      : "—";

    let when = "";

    if(m.time){

      const d =
        new Date(m.time);

      when =
        isNaN(d)
        ? esc(m.time)
        : d.toLocaleString(
            "ru-RU",
            {
              day:"2-digit",
              month:"2-digit",
              hour:"2-digit",
              minute:"2-digit"
            }
          );

    }

    return `

    <article class="match">

      <div class="matchHead">

        <div class="league">
          ${esc(m.league)}
        </div>

        <div class="status ${live ? "liveNow" : ""}">
          ${esc(st)}
        </div>

      </div>

      <div class="scoreRow">

        <div class="team">
          ${logo(m.homeLogo)}
          ${esc(m.home)}
        </div>

        <div class="score">
          ${score(m.hs)}
        </div>

      </div>

      <div class="scoreRow">

        <div class="team">
          ${logo(m.awayLogo)}
          ${esc(m.away)}
        </div>

        <div class="score">
          ${score(m.as)}
        </div>

      </div>

      <div class="divider"></div>

      <div class="meta">

        <span>
          ${when || "Время уточняется"}
        </span>

        <span>
          ${esc(sport)}
        </span>

      </div>

    </article>

    `;

  }).join("");

}

async function load(){

  box.innerHTML =
  '<div class="skeleton"></div>' +
  '<div class="skeleton"></div>';

  try{

    const url =
      "https://sportscore.com/api/widget/matches/" +
      "?sport=" +
      encodeURIComponent(sport) +
      "&limit=30";

    const r =
      await fetch(
        url,
        {
          cache:"no-store"
        }
      );

    if(!r.ok)
      throw new Error(
        "HTTP " + r.status
      );

    const data =
      await r.json();

    render(
      normalize(data)
    );

    document
    .getElementById("updated")
    .textContent =
      "обновлено " +
      new Date()
      .toLocaleTimeString(
        "ru-RU",
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      );

  }

  catch(e){

    console.error(e);

    box.innerHTML =
      '<div class="error">' +
      'Не удалось загрузить данные. ' +
      'Нажми «Обновить данные» через несколько секунд.' +
      '</div>';

    document
    .getElementById("total")
    .textContent = "—";

    document
    .getElementById("live")
    .textContent = "—";

    document
    .getElementById("finished")
    .textContent = "—";

  }

}

document
.querySelectorAll(".filter")
.forEach(b=>{

  b.onclick = ()=>{

    document
    .querySelectorAll(".filter")
    .forEach(
      x=>x.classList.remove("active")
    );

    b.classList.add("active");

    sport =
      b.dataset.sport;

    load();

  };

});

document
.getElementById("refresh")
.onclick = load;

load();

setInterval(
  load,
  60000
);

</script>

</body>
</html>
